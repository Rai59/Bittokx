<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bittokx logo</title>
  <desc id="desc">A geometric token-ring B monogram with a Bittokx wordmark.</desc>
  <defs>
    <linearGradient id="ring" x1="72" y1="62" x2="338" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19E6FF"/>
      <stop offset="0.48" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#FFB13B"/>
    </linearGradient>
    <linearGradient id="exchange" x1="114" y1="283" x2="300" y2="97" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB13B"/>
      <stop offset="1" stop-color="#19E6FF"/>
    </linearGradient>
    <filter id="softShadow" x="40" y="40" width="320" height="320" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#071326" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g id="bittokx-lockup">
    <g id="mark" filter="url(#softShadow)">
      <circle cx="200" cy="200" r="142" fill="#071326"/>
      <circle cx="200" cy="200" r="142" stroke="url(#ring)" stroke-width="16"/>
      <circle cx="200" cy="200" r="106" stroke="#11263D" stroke-width="3"/>

      <path d="M133 111C133 101.059 141.059 93 151 93H211C256.287 93 288 117.802 288 154C288 177.463 274.584 195.982 252.394 205.192C278.357 213.004 294 234.012 294 263C294 302.883 260.912 327 213 327H151C141.059 327 133 318.941 133 309V111Z" fill="#F8FBFF"/>
      <path d="M172 129H209C233.759 129 249 140.681 249 159.5C249 178.319 233.759 190 209 190H172V129Z" fill="#071326"/>
      <path d="M172 226H214C239.641 226 256 238.372 256 258.5C256 278.628 239.641 291 214 291H172V226Z" fill="#071326"/>
      <rect x="112" y="93" width="54" height="234" rx="23" fill="#F8FBFF"/>

      <path d="M290 101L110 281" stroke="url(#exchange)" stroke-width="13" stroke-linecap="round"/>
      <path d="M282 104H306V128" stroke="#19E6FF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M118 278H94V254" stroke="#FFB13B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="200" cy="200" r="48" stroke="#19E6FF" stroke-opacity="0.14" stroke-width="10"/>
    </g>

    <g id="wordmark">
      <text x="430" y="204" fill="#071326" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="-5">Bitto</text>
      <text x="676" y="204" fill="#FFB13B" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="-5">k</text>
      <text x="748" y="204" fill="#19E6FF" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="-5">x</text>
      <rect x="434" y="243" width="242" height="4" rx="2" fill="#19E6FF"/>
      <rect x="692" y="243" width="86" height="4" rx="2" fill="#FFB13B"/>
      <text x="430" y="292" fill="#53657A" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="650" letter-spacing="7">DIGITAL VALUE EXCHANGE</text>
    </g>
  </g>
</svg>
