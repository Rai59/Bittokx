    <rect x="122" y="96" width="64" height="320" fill="#000000"/>
    <circle cx="294" cy="320" r="64" stroke="#000000" stroke-width="64"/>
  </g>

  <!-- Wordmark: custom geometric letterforms, drawn as vector strokes (no font) -->
  <g transform="translate(318 9.2) scale(1.45)" stroke="#000000" stroke-width="16">
    <!-- b -->
    <line x1="8" y1="48" x2="8" y2="160"/>
    <circle cx="32" cy="128" r="24"/>
    <!-- i -->
    <line x1="96" y1="96" x2="96" y2="160"/>
    <circle cx="96" cy="72" r="9" fill="#000000" stroke="none"/>
    <!-- t -->
    <line x1="144" y1="64" x2="144" y2="160"/>
    <line x1="122" y1="96" x2="166" y2="96"/>
    <!-- t -->
    <line x1="212" y1="64" x2="212" y2="160"/>
    <line x1="190" y1="96" x2="234" y2="96"/>
    <!-- o -->
    <circle cx="292" cy="128" r="24"/>
    <!-- k -->
    <line x1="356" y1="48" x2="356" y2="160"/>
    <line x1="356" y1="132" x2="404" y2="96"/>
    <line x1="380" y1="114" x2="408" y2="160"/>
    <!-- x -->
    <line x1="446" y1="96" x2="502" y2="160"/>
    <line x1="502" y1="96" x2="446" y2="160"/>
  </g>
</svg>
