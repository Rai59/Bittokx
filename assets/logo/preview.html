<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bittokx Logo Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #ececec;
        color: #000;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      main {
        display: grid;
        gap: 20px;
        margin: 0 auto;
        max-width: 1160px;
        padding: 44px 24px;
      }

      section {
        background: #fff;
        border-radius: 8px;
        padding: 56px;
      }

      section.dark {
        background: #000;
      }

      .caption {
        color: #888;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        margin: 0 0 32px;
        text-transform: uppercase;
      }

      .dark .caption {
        color: #666;
      }

      .lockup img {
        display: block;
        height: auto;
        width: min(100%, 780px);
      }

      .row {
        align-items: flex-end;
        display: flex;
        flex-wrap: wrap;
        gap: 56px;
      }

      .cell {
        text-align: center;
      }

      .cell span {
        color: #888;
        display: block;
        font-size: 11px;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="lockup">
        <p class="caption">Primary lockup — positive</p>
        <img src="./bittokx-logo.svg" alt="Bittokx logo on white" />
      </section>

      <section class="lockup dark">
        <p class="caption">Primary lockup — reversed</p>
        <img src="./bittokx-logo-white.svg" alt="Bittokx logo on black" />
      </section>

      <section>
        <p class="caption">Mark — scalability</p>
        <div class="row">
          <div class="cell"><img src="./bittokx-mark.svg" width="160" height="160" alt="" /><span>160</span></div>
          <div class="cell"><img src="./bittokx-mark.svg" width="96" height="96" alt="" /><span>96</span></div>
          <div class="cell"><img src="./bittokx-mark.svg" width="48" height="48" alt="" /><span>48</span></div>
          <div class="cell"><img src="./bittokx-mark.svg" width="24" height="24" alt="" /><span>24</span></div>
          <div class="cell"><img src="./bittokx-mark.svg" width="16" height="16" alt="" /><span>16</span></div>
          <div class="cell"><img src="./bittokx-app-icon.svg" width="96" height="96" alt="" /><span>app icon</span></div>
        </div>
      </section>
    </main>
  </body>
</html>
