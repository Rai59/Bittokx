<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bittokx Logo Preview</title>
    <style>
      :root {
        --navy: #071326;
        --cyan: #19e6ff;
        --amber: #ffb13b;
        --slate: #53657a;
        --paper: #f8fbff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #eef3f8;
        color: var(--navy);
        font-family: Inter, "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      }

      main {
        display: grid;
        gap: 28px;
        margin: 0 auto;
        max-width: 1180px;
        padding: 48px 28px;
      }

      .hero,
      .grid-card {
        border: 1px solid rgba(7, 19, 38, 0.08);
        border-radius: 32px;
        box-shadow: 0 24px 70px rgba(7, 19, 38, 0.08);
        overflow: hidden;
      }

      .hero {
        background: var(--paper);
        padding: 56px;
      }

      .hero img {
        display: block;
        height: auto;
        width: min(100%, 920px);
      }

      .grid {
        display: grid;
        gap: 28px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .grid-card {
        align-items: center;
        display: flex;
        justify-content: center;
        min-height: 320px;
        padding: 44px;
      }

      .grid-card.dark {
        background:
          radial-gradient(circle at 25% 10%, rgba(25, 230, 255, 0.22), transparent 30%),
          radial-gradient(circle at 85% 80%, rgba(255, 177, 59, 0.2), transparent 32%),
          var(--navy);
      }

      .grid-card.light {
        background: var(--paper);
      }

      .grid-card img {
        height: auto;
        max-width: 220px;
        width: 64%;
      }

      .caption {
        color: var(--slate);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        margin: 0 0 18px;
        text-transform: uppercase;
      }

      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .swatch {
        align-items: end;
        border-radius: 20px;
        color: white;
        display: flex;
        font-size: 13px;
        font-weight: 750;
        height: 108px;
        letter-spacing: 0.03em;
        padding: 16px;
        width: 160px;
      }

      .swatch.paper {
        border: 1px solid rgba(7, 19, 38, 0.1);
        color: var(--navy);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="caption">Primary lockup</p>
        <img src="./bittokx-logo.svg" alt="Bittokx full logo" />
      </section>

      <section class="grid">
        <div class="grid-card dark">
          <img src="./bittokx-mark.svg" alt="Bittokx mark on dark background" />
        </div>
        <div class="grid-card light">
          <img src="./bittokx-mark.svg" alt="Bittokx mark on light background" />
        </div>
      </section>

      <section>
        <p class="caption">Core palette</p>
        <div class="swatches">
          <div class="swatch" style="background: var(--navy)">#071326</div>
          <div class="swatch" style="background: var(--cyan); color: var(--navy)">#19E6FF</div>
          <div class="swatch" style="background: var(--amber); color: var(--navy)">#FFB13B</div>
          <div class="swatch paper" style="background: var(--paper)">#F8FBFF</div>
        </div>
      </section>
    </main>
  </body>
</html>
